name: Dependency freshness

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-freshness:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install freshness dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run dependency freshness checker
        run: |
          python tools/check_dependency_freshness.py --github-output
